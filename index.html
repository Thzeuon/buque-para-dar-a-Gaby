<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a minha princesinha ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #24101d 0%, #100811 65%, #080509 100%);
    overflow-x: hidden;
    overflow-y: auto;
    font-family: Georgia, serif;
    color: white;
}

h1 {
    text-align: center;
    color: #b52e65;
    font-size: clamp(25px, 5vw, 43px);
    margin: 35px 10px 0;
    text-shadow: 0 0 15px #a51b58, 0 0 35px #65102f;
    font-weight: normal;
    position: relative;
    z-index: 2;
}

.subtitle {
    text-align: center;
    color: #e8a1bd;
    font-size: 14px;
    letter-spacing: 3px;
    margin-top: 12px;
    position: relative;
    z-index: 2;
}

.bouquet-container {
    width: min(100%, 850px);
    margin: 0 auto;
    position: relative;
    z-index: 2;
}

svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
}

/* FLORES */
.petal {
    stroke: #8d153e;
    stroke-width: 1.5;
}

.flower {
    filter: drop-shadow(0 0 5px #a92b58);
}

.center {
    fill: url(#gold);
    stroke: #8e4b25;
    stroke-width: 2;
}

.leaf {
    fill: url(#leafGradient);
    stroke: #164b32;
    stroke-width: 2;
}

.stem {
    fill: none;
    stroke: #39794b;
    stroke-width: 7;
    stroke-linecap: round;
}

.wrapper {
    fill: url(#paper);
    stroke: #d98ba9;
    stroke-width: 3;
}

.bow {
    fill: #bd315f;
    stroke: #f08aaa;
    stroke-width: 2;
}

/* COISAS A FLUTUAR NO FUNDO */
.floating {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    z-index: 1;
    animation: floatUp linear infinite;
    opacity: 0;
    text-shadow: 0 0 12px currentColor;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: .85; }
    85% { opacity: .7; }
    100% {
        transform: translateY(-115vh) rotate(35deg);
        opacity: 0;
    }
}

@media(max-width: 600px) {
    h1 { margin-top: 25px; }
    .subtitle { letter-spacing: 2px; }
}
</style>
</head>

<script>
const symbols = [
    "♡", "♥", "<3", "ღ", "✧", "୨୧",
    "I love you", "♡", "♥", "⋆", "✿"
];

const colors = [
    "#ff8eb8", "#ff4f87", "#e8a1d0",
    "#ffd4e5", "#d85b91", "#ffffff"
];

function createFloatingSymbol() {
    const item = document.createElement("div");
    item.className = "floating";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    item.style.left = Math.random() * 100 + "vw";
    item.style.color = colors[Math.floor(Math.random() * colors.length)];
    item.style.fontSize = (14 + Math.random() * 22) + "px";
    item.style.animationDuration = (7 + Math.random() * 9) + "s";

    document.body.appendChild(item);

    setTimeout(() => item.remove(), 17000);
}

setInterval(createFloatingSymbol, 450);
</script>
